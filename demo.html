<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>西米 · 全流程互动体验</title>
<style>
:root{--paper:#F4F0E4;--card:#FBF6EA;--ink:#3A3036;--ink2:#6F636B;--ink3:#8C7F87;--seal:#B03A2E;--edge:rgba(120,90,70,.16);--gold:#B08D3E;--green:#3E7D5B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#2E2824;font-family:PingFang SC,-apple-system,sans-serif;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:18px 0}
#phone{width:390px;height:800px;background:var(--paper);border-radius:34px;overflow:hidden;position:relative;box-shadow:0 24px 70px rgba(0,0,0,.55);display:flex;flex-direction:column}
#pages{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;display:none;background:var(--paper)}
.page.on{display:block;animation:pin .22s}
@keyframes pin{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.page.on{animation:none}}
.nb-bar{padding:14px 18px 10px;font-size:16px;font-weight:600;color:var(--ink);text-align:center;border-bottom:1px solid var(--edge);position:sticky;top:0;background:var(--paper);z-index:5}
.nb-bar .back{position:absolute;left:14px;top:12px;font-size:14px;color:var(--ink2);cursor:pointer}
.nb-bar .sub{display:block;font-size:10px;font-weight:400;color:var(--ink3);letter-spacing:.2em}
/* onboard */
#p-onboard{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 34px;gap:14px}
.seal-lg{width:96px;height:96px;background:var(--seal);color:#F6F1E6;border-radius:6px;font-family:Songti SC,STSong,serif;font-size:40px;font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:3px;transform:rotate(-3deg);box-shadow:3px 4px 0 rgba(46,40,36,.15)}
.on-t1{font-family:Songti SC,STSong,serif;font-size:27px;font-weight:900;letter-spacing:.08em;margin-top:10px}
.on-t2{color:var(--ink2);font-size:14px;line-height:1.8}
.on-opts{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:16px}
.on-opt{border:1px solid var(--edge);background:var(--card);border-radius:10px;padding:13px;font-size:15px;cursor:pointer;color:var(--ink)}
.on-opt:active{background:#F1E9D6}
.enter-btn{margin-top:20px;width:80%;height:46px;border-radius:23px;background:var(--seal);color:#F6F1E6;font-size:16px;letter-spacing:.3em;text-indent:.3em;border:none;cursor:pointer}
/* home */
.hero{height:250px;position:relative;overflow:hidden;border-radius:0 0 22px 22px;background:linear-gradient(175deg,#DCE5DA,#E9E9DC 55%,#F4F0E4)}
.hero:before{content:'';position:absolute;inset:0;background:radial-gradient(130% 60% at 80% 100%,rgba(62,125,91,.18),transparent 60%),radial-gradient(90% 40% at 10% 0%,rgba(255,255,255,.5),transparent)}
.hero .hx{position:absolute;left:22px;top:34px}
.hero .hx b{font-family:Songti SC,STSong,serif;font-size:26px;letter-spacing:.3em;color:var(--seal)}
.hero .hx i{display:block;font-style:normal;font-size:10px;letter-spacing:.5em;color:var(--ink2);margin-top:2px}
.hero .hx em{display:block;font-style:normal;font-family:Songti SC,STSong,serif;font-size:17px;color:var(--ink);margin-top:44px;letter-spacing:.04em}
.hwrap{padding:16px 18px 8px}
.hq{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:14px 16px;position:relative;box-shadow:0 4px 14px rgba(58,48,54,.05)}
.hq .lb{font-size:10px;letter-spacing:.28em;color:var(--seal);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.hq .lb .sh{color:var(--ink2);letter-spacing:0;border:1px solid var(--edge);border-radius:999px;padding:2px 10px;font-size:11px;cursor:pointer}
.hq .qt{font-family:Songti SC,STSong,serif;font-size:16px;line-height:1.8;margin-top:8px}
.hq .au{font-size:12px;color:var(--ink3);margin-top:6px}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 18px}
.hcell{background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:16px;font-size:14px;cursor:pointer}
.hcell b{display:block;font-size:15px;margin-bottom:3px}
.hcell span{font-size:12px;color:var(--ink2)}
.hcell .ic{font-size:20px;margin-bottom:8px;display:block}
/* hero ximi orb */
.orb{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#B9A6F2,#7C5CD6 60%,#5A3FB0);box-shadow:0 6px 18px rgba(122,92,214,.45),inset -6px -8px 14px rgba(255,255,255,.25);position:relative;cursor:pointer}
.orb:after{content:'◡ ‿ ◡';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;letter-spacing:-1px}
.orb-row{display:flex;align-items:flex-end;gap:10px;padding:0 18px 6px;margin-top:-46px;position:relative;z-index:2}
.orb-bub{background:#FFFDF4;border:1px solid var(--edge);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:13px;color:var(--ink);box-shadow:0 4px 12px rgba(58,48,54,.06);flex:1;cursor:pointer}
.orb-meta{padding:6px 18px 0;font-size:11px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:var(--green);display:inline-block}
/* content */
.gr-theme{margin:16px 18px;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:16px 18px}
.gr-theme .lb{font-size:10px;letter-spacing:.24em;color:var(--seal);font-weight:600}
.gr-theme .tb{font-family:Songti SC,STSong,serif;font-size:21px;font-weight:400;line-height:1.35;margin-top:6px}
.gr-theme .tm{font-size:11px;color:var(--ink3);margin-top:8px}
.nb{margin:0 18px;background:var(--card);border:1px solid var(--edge);border-radius:6px 14px 14px 14px;padding:14px 16px;cursor:pointer;position:relative}
.nb:before{content:'';position:absolute;top:-8px;left:20px;width:64px;height:14px;background:rgba(226,205,160,.9);transform:rotate(-3deg);border-radius:2px}
.nb .nb-t{font-family:Songti SC,STSong,serif;font-size:17px;font-weight:700}
.nb .nb-t span{font-size:10px;color:var(--ink3);letter-spacing:.2em;font-weight:400;margin-left:8px}
.nb .nb-line{font-size:14px;color:var(--ink2);margin:8px 0 10px}
.nb .nb-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3)}
.nb .nb-go{color:var(--seal)}
.col-card{margin:12px 18px;background:var(--card);border:1px solid var(--edge);border-radius:14px;overflow:hidden;cursor:pointer}
.col-card img,.col-card .colbg{width:100%;height:110px;object-fit:cover;display:block;background:linear-gradient(160deg,#D8E2D4,#EFE9D8)}
.col-card .cb{padding:12px 16px}
.col-card .cb b{font-size:15px}
.col-card .cb p{font-size:12px;color:var(--ink2);margin:4px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* grow */
.grow-hero{margin:16px 18px;border-radius:16px;height:210px;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 70% 10%,#3A3550,#191A26 70%)}
.grow-hero .gt{position:absolute;left:20px;top:22px;color:#E8E2D2;font-family:Songti SC,STSong,serif}
.grow-hero .gt b{font-size:22px;display:block}
.grow-hero .gt span{font-size:11px;color:#B9B2A0;letter-spacing:.2em}
.grow-hero .gl{position:absolute;left:20px;bottom:22px;color:#E8E2D2}
.grow-hero .gl b{font-size:30px}
.grow-hero .gl span{font-size:12px;color:#B9B2A0}
.lamps{position:absolute;inset:0}
.lamp{position:absolute;width:7px;height:7px;border-radius:50%;background:#D9B96A;box-shadow:0 0 8px 2px rgba(217,185,106,.55);opacity:.9}
.lamp.dim{background:#4A4A5A;box-shadow:none;opacity:.4}
.gstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 18px}
.gstat{background:var(--card);border:1px solid var(--edge);border-radius:14px;text-align:center;padding:14px 0}
.gstat b{font-size:24px;color:var(--seal);font-family:Songti SC,STSong,serif}
.gstat span{display:block;font-size:11px;color:var(--ink2);margin-top:3px}
.tl{margin:0 18px 20px}
.tl-item{border-left:2px solid var(--edge);padding:0 0 16px 14px;position:relative}
.tl-item:before{content:'';position:absolute;left:-5px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--card);border:2px solid var(--ink3)}
.tl-item .tt{font-size:11px;color:var(--ink3)}
.tl-item .tx{font-size:14px;margin-top:3px}
.tl-item .tg{font-size:11px;color:var(--gold);margin-top:3px}
/* me */
.me-card{margin:16px 18px;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:center}
.me-av{width:58px;height:58px;border-radius:50%;background:linear-gradient(150deg,#D8CDE0,#C7B9D8);display:flex;align-items:center;justify-content:center;font-size:24px}
.me-card b{font-size:17px}
.me-card span{display:block;font-size:12px;color:var(--ink2);margin-top:3px}
.member{margin:0 18px 14px;background:linear-gradient(150deg,#3A3036,#241F1D);color:#E8D9B4;border-radius:14px;padding:16px 18px;font-size:13px}
.member b{font-size:15px;color:#F0E6D2;display:block;margin-bottom:3px}
.mrows{margin:0 18px}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:15px 4px;border-bottom:1px solid var(--edge);font-size:14px;cursor:pointer}
.mrow:after{content:'›';color:var(--ink3)}
.mrow span{color:var(--ink3);font-size:12px}
/* chat */
.modebar{display:flex;gap:18px;padding:10px 18px;font-size:14px;color:var(--ink3);border-bottom:1px solid var(--edge);position:sticky;top:49px;background:var(--paper);z-index:5}
.modebar span{cursor:pointer;padding-bottom:6px}
.modebar span.on{color:var(--ink);font-weight:600;border-bottom:2px solid var(--seal)}
#msgs{padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:78%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.msg.ai{background:var(--card);border:1px solid var(--edge);border-radius:4px 14px 14px 14px;align-self:flex-start}
.msg.user{background:#EFE3D2;border-radius:14px 4px 14px 14px;align-self:flex-end}
.msg.role{background:#F3E4D8;border:1px solid rgba(176,141,62,.35);border-radius:4px 14px 14px 14px;align-self:flex-start}
.msg.role .rt{display:block;font-size:10px;color:var(--gold);letter-spacing:.2em;margin-bottom:4px}
.typing{align-self:flex-start;color:var(--ink3);font-size:13px;padding:4px 2px}
.chips{align-self:flex-start;display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid rgba(176,141,62,.5);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;background:#FDF8EC}
.chip.coach{border-color:rgba(176,141,62,.8)}
.nudge{align-self:stretch;background:#F3E4D8;border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px;align-items:center}
.nudge button{border:none;background:var(--seal);color:#fff;border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;flex:none}
#composer{display:flex;gap:10px;padding:10px 14px 14px;border-top:1px solid var(--edge);background:var(--paper)}
#composer input{flex:1;border:1px solid var(--edge);border-radius:999px;height:40px;padding:0 16px;font-size:14px;background:#FFFDF4;color:var(--ink);outline:none}
#composer button{width:40px;height:40px;border-radius:50%;background:var(--seal);color:#fff;border:none;font-size:17px;cursor:pointer}
/* crisis card */
#crisis{position:absolute;inset:0;background:rgba(46,40,36,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:30px}
#crisis.on{display:flex}
#crisis .cc{background:var(--card);border-radius:18px;padding:26px 22px;text-align:center;width:100%}
#crisis .cc .h{font-size:17px;font-weight:700;margin:12px 0 8px}
#crisis .cc p{font-size:13px;color:var(--ink2);line-height:1.9;margin:0}
#crisis .cc .hot{font-size:15px;font-weight:700;margin:10px 0 16px}
#crisis .cc .call{display:block;background:var(--seal);color:#fff;border-radius:12px;padding:13px;font-size:15px;text-decoration:none;cursor:pointer}
#crisis .cc .calm{margin-top:10px;color:var(--ink3);font-size:13px;cursor:pointer;padding:8px}
#crisis .cc .calm.dis{opacity:.45;cursor:not-allowed}
#crisis .cc .safe{font-size:11px;color:var(--ink3);margin-top:10px}
/* overlays: sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:16px 18px 22px;transform:translateY(105%);transition:transform .25s;z-index:40;box-shadow:0 -8px 30px rgba(46,40,36,.18)}
.sheet.on{transform:none}
.sheet h4{margin:0 0 4px;font-size:16px}
.sheet .sh-sub{font-size:12px;color:var(--ink2);margin-bottom:12px}
.sheet textarea{width:100%;height:110px;border:1px solid var(--edge);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;background:#FFFDF4;resize:none;outline:none}
.sheet .schips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sheet .schip{font-size:12px;border:1px solid var(--edge);border-radius:999px;padding:4px 11px;cursor:pointer;color:var(--ink2)}
.sheet .schip.on{border-color:var(--seal);color:var(--seal)}
.btn{width:100%;height:44px;border-radius:22px;background:var(--seal);color:#fff;border:none;font-size:15px;cursor:pointer;margin-top:12px}
.btn.ghost{background:none;border:1px solid var(--edge);color:var(--ink2)}
/* consultants / cdetail / report */
.c-card{margin:14px 18px;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:16px;display:flex;gap:14px;cursor:pointer;align-items:center}
.c-av{width:56px;height:56px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-family:Songti SC,STSong,serif}
.c-card b{font-size:16px}
.c-card .ct{font-size:11px;color:var(--ink2);margin-top:2px}
.c-card .cp{font-size:13px;color:var(--seal);margin-top:4px;font-weight:600}
.cd-head{text-align:center;padding:24px 18px 14px}
.cd-av{width:86px;height:86px;border-radius:14px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;font-family:Songti SC,STSong,serif}
.cd-head h3{margin:0;font-size:19px}
.cd-head .ct{font-size:12px;color:var(--ink2);margin-top:4px}
.cd-stats{display:flex;justify-content:center;gap:26px;margin:14px 0}
.cd-stats div{text-align:center}
.cd-stats b{font-size:17px;display:block}
.cd-stats span{font-size:11px;color:var(--ink3)}
.cd-body{margin:0 18px;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:14px 16px;font-size:13px;line-height:1.9;color:var(--ink2)}
.cd-tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 18px}
.cd-tags span{font-size:11px;border:1px solid var(--edge);border-radius:999px;padding:3px 10px;color:var(--ink2)}
.slots{display:flex;flex-wrap:wrap;gap:9px;margin:10px 18px}
.slot{border:1px solid var(--edge);border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer;background:var(--card);color:var(--ink)}
.slot.on{border-color:var(--seal);color:var(--seal);background:#F9EDE4}
.rep{margin:16px 18px;background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:20px 18px}
.rep .rh{text-align:center;border-bottom:1px solid var(--edge);padding-bottom:14px;margin-bottom:14px}
.rep .rh .sh{font-size:26px}
.rep .rh b{font-family:Songti SC,STSong,serif;font-size:19px;display:block;margin-top:6px}
.rep .rh span{font-size:10px;letter-spacing:.3em;color:var(--ink3)}
.rep .sec{margin-top:13px}
.rep .sec .sl{font-size:12px;color:var(--gold);font-weight:600}
.rep .sec p{margin:5px 0 0;font-size:13px;line-height:1.8}
.rep .emotions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.rep .emotions span{border:1px solid var(--edge);background:#F1E9D6;border-radius:8px;padding:4px 12px;font-size:13px}
.rep .ubar{height:6px;border-radius:3px;background:#EDE5D2;overflow:hidden;margin-top:7px}
.rep .ubar i{display:block;height:100%;background:var(--seal);border-radius:3px}
.rep .disc{font-size:11px;color:var(--ink3);text-align:center;margin-top:14px}
/* pay sheet */
.paysum{display:flex;justify-content:space-between;font-size:14px;padding:8px 0}
.paysum.total{font-weight:700;border-top:1px dashed var(--edge);margin-top:6px;padding-top:12px}
.paysum.total b{color:var(--seal);font-size:18px}
/* toast */
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(46,40,36,.92);color:#F6F1E6;font-size:13px;border-radius:999px;padding:9px 18px;opacity:0;transition:opacity .25s;z-index:80;pointer-events:none;max-width:82%;text-align:center}
#toast.on{opacity:1}
/* tabbar */
#tabbar{display:flex;border-top:1px solid var(--edge);background:var(--card);padding:8px 0 14px}
#tabbar .tb-i{flex:1;text-align:center;font-size:11px;color:var(--ink3);cursor:pointer}
#tabbar .tb-i .ic{font-size:21px;display:block;margin-bottom:1px}
#tabbar .tb-i.on{color:var(--seal);font-weight:600}
.hidden{display:none!important}
</style></head><body>
<div id="phone">
<div id="pages">
  <section class="page" id="p-onboard"></section>
  <section class="page" id="p-home"></section>
  <section class="page" id="p-chat"><div class="nb-bar">西米<span class="sub">24H 倾听中 · 点气泡聊聊</span></div>
    <div class="modebar"><span data-mode="friend" class="on">闺蜜</span><span data-mode="coach">教练</span></div>
    <div id="msgs"></div>
    <div id="composer"><input id="chat-input" placeholder="想到哪，说到哪…"><button id="send-btn">↑</button></div>
  </section>
  <section class="page" id="p-content"><div class="nb-bar">每日成长</div><div id="content-body"></div></section>
  <section class="page" id="p-grow"><div class="nb-bar">我的变化</div><div id="grow-body"></div></section>
  <section class="page" id="p-me"><div class="nb-bar">我的</div><div id="me-body"></div></section>
  <section class="page" id="p-consultants"><div class="nb-bar"><span class="back" data-go="home">‹ 返回</span>咨询师</div><div id="cons-body"></div></section>
  <section class="page" id="p-cdetail"><div class="nb-bar"><span class="back" data-go="consultants">‹ 返回</span>咨询师详情</div><div id="cd-body"></div></section>
  <section class="page" id="p-prediag"><div class="nb-bar"><span class="back" data-go="home">‹ 返回</span>预诊断</div><div id="pd-body" style="padding:0 0 20px"></div></section>
  <section class="page" id="p-report"><div class="nb-bar">预诊断完成</div><div id="rp-body"></div></section>
</div>
<div id="crisis"><div class="cc"><div class="sh" style="font-size:26px">♡</div><div class="h">您的情况可能需要专业支持</div><p>我们已为你预留紧急咨询通道<br>24小时心理援助热线</p><div class="hot">400-161-9995</div><a class="call" href="tel:4001619995">立即拨打热线</a><div class="calm dis" id="calm-btn">我先冷静一下</div><div class="safe">为保障你的安全，此提醒暂不可关闭</div></div></div>
<div class="sheet" id="jnl-sheet"><h4>情绪手记</h4><div class="sh-sub">今天想记下什么？不用条理，写乱一点也行。</div><div class="schips" id="jnl-chips"></div><textarea id="jnl-text" placeholder="今天……"></textarea><button class="btn" id="jnl-send">写完，点亮一盏灯</button><button class="btn ghost" id="jnl-close">先不写了</button></div>
<div class="sheet" id="pay-sheet"><h4>确认订单</h4><div class="sh-sub" id="pay-who"></div><div class="paysum"><span>预约时段</span><span id="pay-slot"></span></div><div class="paysum"><span>诊断报告</span><span>已附 · 咨询师可提前了解</span></div><div class="paysum total"><span>合计</span><b id="pay-amt"></b></div><button class="btn" id="pay-do" style="background:var(--green)">微信支付</button><div class="sh-sub" style="margin-top:10px;text-align:center">支付成功后跳转企业微信，咨询师确认后服务开始</div><button class="btn ghost" id="pay-close">再想想</button></div>
<div id="toast"></div>

 *   原型里多处芯片写 k:'company'，但 S 表里**没有** S['company'] —— 是悬空键。

 *   本移植给 company 一个明确收束，文案直接取自原型确认卡「先不用，就想说说」的 onNo 支线
 *   （['行。那就先不解决它。','你说，我听着。']），未自创一字。

/* ---------- 轻确认卡（原型 freeform 的 asksHow 支线） ---------- */
const COACH_CONFIRM = {
  lead: ['听见了。这件事你想说的，我大概明白。'],
  text: '要不要我帮你理一理？我会问几个具体的，然后给你一个能用的做法。',
  yes: '好，帮我理理',
  no: '先不用，就想说说',
  yesGo: 'sort',
  noGo: '__keep-friend'
};

/* ---------- 自由输入的关键词分流（原型 freeform，逐条照抄） ----------
 * 顺序即优先级：asksHow → 婆婆 → 孩子 → 老公 → 累 → 兜底
 * crisis 不在此表（红线：走 modules/crisis.js 的前置过滤） */
const FREE_RE = {
  asksHow: /怎么办|该不该|怎么解决|有什么办法|怎么才能|如何是好|救我/,
  sleepy: /睡不着|失眠|半夜醒/,
  tired: /累|烦|难受|委屈|撑不住|崩溃|想哭/,
  husband: /老公|丈夫|他|伴侣/,
  mil: /婆婆|婆家/,
  child: /孩子|儿子|女儿|娃/
};

/* 自由输入 → 节点键（不含 asksHow，见 route） */
function routeFree(text) {
  const t = String(text || '');
  if (FREE_RE.mil.test(t)) return 'mil-sort';
  if (FREE_RE.child.test(t)) return 'child-sort';
  if (FREE_RE.husband.test(t)) return 'husband-sort';
  if (FREE_RE.tired.test(t)) return '__tired-free';
  return '__fallback';
}

/* 自由输入的**完整**分流，顺序严格照原型 freeform：
 *   睡不好 → 问怎么办 → 婆婆 → 孩子 → 老公 → 累 → 兜底
 * 返回：
 *   { k: '节点键' }        直接走该节点
 *   { confirm: true }     闺蜜模式下问「要不要帮你理一理」→ 轻确认卡
 * 危机不在本表：红线，由页面用 modules/crisis 在**最前面**拦（原型也是第一个判断）。
 */
function route(text, mode) {
  const t = String(text || '');
  if (FREE_RE.sleepy.test(t)) return { k: '__sleepy' };
  if (FREE_RE.asksHow.test(t)) return mode === 'friend' ? { confirm: true } : { k: 'sort' };
  return { k: routeFree(t) };
}

const DRILL = {
  defensive: {
    re: /你总是|你从来|你每次都|凭什么|你就不能|为什么你/,
    role: '你又来了。\n我上班一天回来，你就不能让我清静会儿？',
    review: [
      '（回到我）刚才那句，我作为他会立刻竖起来——因为开头是"你总是"。',

      '换一个开头：只说这一次、只说一件事，从"我"起头。',
      '比如：「昨天你答应孩子的事没做到，我一个人应付了一晚上，挺难的。」',
      '再来一次？'
    ]
  },
  soft: {
    re: /我|觉得|希望|有点|挺/,
    role: '……我没说不做啊。\n你别什么事都上纲上线行不行？',
    review: [
      '（回到我）这次他没炸，但开始躲了——"上纲上线"是他把话题推开的方式。',
      '这时候别追着讲道理，把话题拉回具体的一件事：',
      '「我不是说你这个人的问题。就是昨天那一件——你答应了的。」',
      '一次只谈一件。他才能接得住。',
      '再来一次？'
    ]
  },
  silent: {
    re: null,
    role: '嗯。\n（他没说话，低头看手机）',
    review: [
      '（回到我）他沉默了。沉默不是同意，是在等这件事过去。',
      '沉默的时候，加一句"邀请"会好一点——',
      '「我不是要吵，我就是想让你知道我一个人有点扛不住。」',
      '再来一次？'
    ]
  }
};

function drillReply(text) {

function rawRequest(path, method = 'GET', data = {}, token = '') {
  return new Promise((resolve, reject) => {
    wx.request({
      url: BASE_URL + path,
      method,
      data,
      header: { 'content-type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      success(res) {
        if (res.statusCode >= 200 && res.statusCode < 300) resolve(res.data);
        else reject(new Error('HTTP ' + res.statusCode + ': ' + JSON.stringify(res.data)));
      },
      fail: reject
    });
  });
}

function request(path, method = 'GET', data = {}) {

/* ---------- chat 引擎（逐字移植 chat.js 交互语义） ---------- */
function pushMsg(kind, role, text) {
  const d = document.createElement('div');
  if (kind === 'msg') { d.className = 'msg ' + role; if (role === 'role') d.innerHTML = '<span class="rt">演练中 · 他</span>' + esc(text); else d.textContent = text; }
  else if (kind === 'typing') { d.className = 'typing'; d.textContent = '西米正在输入…'; }
  $('#msgs').appendChild(d); scrollBottom(); return d;
}
function pushChips(items) {
  const d = document.createElement('div'); d.className = 'chips';
  items.forEach(c => { const b = document.createElement('span'); b.className = 'chip' + (c.coach ? ' coach' : ''); b.textContent = c.t; b.addEventListener('click', () => { d.remove(); pushMsg('msg', 'user', c.t); runBranch(c.k); }); d.appendChild(b); });
  $('#msgs').appendChild(d); scrollBottom();
}
function scrollBottom() { const p = $('#p-chat'); p.scrollTop = p.scrollHeight; }
let typingEl = null;
function setTyping(on) { if (typingEl) { typingEl.remove(); typingEl = null; } if (on) { typingEl = pushMsg('typing'); } }
function later(fn, ms) { return new Promise(r => setTimeout(() => { fn(); r(); }, ms)); }
function say(lines) {
  return lines.reduce((p, line) => p.then(() => new Promise(res => {
    const text = typeof line === 'string' ? line : line.s;
    const role = typeof line === 'object' && line.role;
    setTyping(true);
    setTimeout(() => {
      setTyping(false); pushMsg('msg', role ? 'role' : 'ai', text);
      setTimeout(res, 180);
    }, 430 + Math.min((text || '').length * 22, 900));
  })), Promise.resolve());
}
function runBranch(key) {
  if (S._busy) return; S._busy = true;
  const node = SC.BRANCHES[key] || SC.FREE_NODES[key];
  const done = () => { S._busy = false; };
  if (!node) { say(SC.FREE_NODES['__fallback'].say).then(() => { pushChips(SC.FREE_NODES['__fallback'].chips); done(); }); return; }
  let chain = Promise.resolve();
  if (node.coach && S.mode !== 'coach') chain = chain.then(() => switchMode('coach'));
  if (node.say) chain = chain.then(() => say(node.say));
  if (node.chips) chain = chain.then(() => pushChips(node.chips));
  if (node.drill) chain = chain.then(() => { S._drill = true; });
  if (node.drillEnd) chain = chain.then(() => { S._drill = false; addLamp(); });
  if (node.lamp) chain = chain.then(() => addLamp());
  if (node.toast) chain = chain.then(() => toast(node.toast));
  if (node.nudge && !S._nudged) chain = chain.then(showNudge);
  chain.catch(e => { console.error('branch err', e); }).then(done, done);
}
function runDrill(text) {
  S._busy = true;
  const r = SC.drillReply(text);
  setTyping(true); scrollBottom();
  setTimeout(() => {
    setTyping(false); pushMsg('msg', 'role', r.role);
    setTimeout(() => say([r.review]).then(() => { pushChips(SC.DRILL_CHIPS); S._busy = false; }), 420);
  }, 760);
}
function switchMode(m) {
  S.mode = m;
  $$('.modebar span').forEach(s => s.classList.toggle('on', s.dataset.mode === m));
  $('#chat-input').placeholder = SC.PLACEHOLDER[m];
  if (m === 'coach' && !S._coachWelcomed) { S._coachWelcomed = true; return say(['教练模式开好了。', '这里不哄人——我们直接把事捋清楚。', '说一件最想解决的事。']); }
  return Promise.resolve();
}
function triggerCrisis() {
  S._busy = true; setTyping(true); scrollBottom();
  setTimeout(() => {
    setTyping(false); pushMsg('msg', 'ai', crisis.REPLY);
    $('#crisis').classList.add('on'); $('#calm-btn').classList.add('dis');
    S._busy = false;
    setTimeout(() => $('#calm-btn').classList.remove('dis'), crisis.TIMING.calm);
  }, crisis.TIMING.typing);
}
function showNudge() {
  S._nudged = true;
  const d = document.createElement('div'); d.className = 'nudge';
  d.innerHTML = '<span>最近睡得还好吗？想做一次 3 分钟呼吸，把身体先放下来。</span>';
  const yes = document.createElement('button'); yes.textContent = '好，试一下';
  yes.addEventListener('click', () => { d.remove(); toast('3 分钟呼吸练习即将开始（演示）'); addLamp(); });
  d.appendChild(yes); $('#msgs').appendChild(d); scrollBottom();
}
function sendChat() {
  const input = $('#chat-input'); const v = input.value.trim();
  if (!v || S._busy) return;
  input.value = ''; /* chat.js 语义：busy 由 runBranch/drill 独占，send 不设 */

  pushMsg('msg', 'user', v);
  if (crisis.isCrisis(v)) { triggerCrisis(); return; }
  if (S._drill) { runDrill(v); return; }
  const r = SC.route(v, S.mode);
  if (r.confirm) { runBranch('sort'); return; }
  runBranch(r.k);
}
$$('.modebar span').forEach(s => s.addEventListener('click', () => switchMode(s.dataset.mode)));
$('#send-btn').addEventListener('click', sendChat);
$('#chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

  });

$('#pay-close').addEventListener('click', () => $('#pay-sheet').classList.remove('on'));
$('#pay-do').addEventListener('click', () => {
  $('#pay-sheet').classList.remove('on');
  toast('支付成功 · 已跳转企业微信 · 演示结束');
  addLamp();
});

/* ---------- prediag / report ---------- */
function openPrediag() {
  go('prediag'); S.pd = { step: 0, qs: [], ans: [], running: true };
  $('#pd-body').innerHTML = '<div style="text-align:center;color:var(--ink3);font-size:13px;padding:40px 0">加载中…</div>';
  api.fetchPrediagQuestions().then(qs => { S.pd.qs = qs; S.pd.running = false; renderPd(); });
}
function renderPd() {
  const p = S.pd, q = p.qs[p.step];
  if (p.running) { $('#pd-body').innerHTML = '<div style="text-align:center;color:var(--ink3);font-size:13px;padding:30px 0 10px">西米正在输入…</div>'; return; }
  $('#pd-body').innerHTML = '<div style="display:flex;gap:6px;justify-content:center;padding:18px 0 4px">' + p.qs.map((_, i) => '<span style="width:9px;height:9px;border-radius:50%;background:' + (i <= p.step ? 'var(--seal)' : 'var(--edge)') + '"></span>').join('') + '</div>' +
    '<div style="padding:10px 20px"><div class="msg ai" style="max-width:100%;white-space:pre-wrap">' + esc(q.q) + '</div>' +
    '<div class="on-opts" style="margin-top:14px">' + q.opts.map(o => '<div class="on-opt" data-o="' + esc(o) + '">' + esc(o) + '</div>').join('') + '</div></div>';
  $$('#pd-body .on-opt').forEach(o => o.addEventListener('click', () => pdAnswer(o.dataset.o)));
}
function pdAnswer(opt) {
  const p = S.pd; if (p.running) return; p.running = true;
  p.ans.push(opt); p.step++;
  if (p.step >= p.qs.length) {
    $('#pd-body').innerHTML = '<div style="text-align:center;padding:60px 0;color:var(--ink2);font-size:14px">生成中…<br><span style="font-size:12px;color:var(--ink3)">正在把你的回答交给匹配算法</span></div>';
    api.submitPrediagAnswers(p.ans).then(res => { S.report = res.report; setTimeout(() => { go('report'); renderReport(); }, 900); });
    return;
  }
  setTimeout(() => { p.running = false; renderPd(); }, 500);
}
function renderReport() {
  const r = S.report || {};
  $('#rp-body').innerHTML = '<div class="rep"><div class="rh"><span>♡</span><b>初步诊断报告</b><span>PRE-DIAGNOSIS REPORT</span></div>' +
    '<div class="sec"><div class="sl">核心情绪</div><div class="emotions">' + (r.emotions || []).map(e => '<span>' + esc(e) + '</span>').join('') + '</div></div>' +
    '<div class="sec"><div class="sl">主要矛盾</div><p>' + esc(r.conflict || '') + '</p></div>' +
    '<div class="sec"><div class="sl">咨询目标</div><p>' + esc(r.goal || '') + '</p></div>' +
    '<div class="sec"><div class="sl">紧急程度</div><div class="ubar"><i style="width:' + Math.round((r.urgency ? r.urgency.level : 0.5) * 100) + '%"></i></div><p style="margin-top:6px">' + esc(r.urgency ? r.urgency.label : '') + '</p></div>' +
    '<div class="sec"><div class="sl">建议方向</div><p>' + esc(r.direction || '') + '</p></div>' +
    '<div class="disc">本报告由 AI 生成，仅供参考，不构成医疗诊断</div></div>' +
    '<button class="btn" style="width:auto;margin:4px 18px 24px;padding:0 30px" id="rp-go">查看匹配咨询师（3 位）</button>';
  $('#rp-go').addEventListener('click', openConsultants);
}

/* ---------- boot ---------- */
window.S = S; window.SC = SC; window.crisis = crisis;
renderOnboard(); go('onboard');
setTimeout(() => { pushMsg('msg', 'ai', SC.greetByHour()); pushChips(SC.CHIPS_FRIEND); }, 400);
